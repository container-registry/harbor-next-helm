apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "harbor.fullname" . }}-registry-env
  labels:
    {{- include "harbor.componentLabels" (dict "root" . "component" "registry") | nindent 4 }}
data:
  # Registry configuration
  CORE_URL: {{ include "harbor.core.url" . | quote }}
  JOBSERVICE_URL: {{ include "harbor.jobservice.url" . | quote }}

  # Storage configuration
  REGISTRY_STORAGE: {{ .Values.registry.storage.type | quote }}
  {{- if eq .Values.registry.storage.type "filesystem" }}
  REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: {{ .Values.registry.storage.filesystem.rootdirectory | default "/storage" | quote }}
  {{- end }}

  # S3 Storage
  {{- if eq .Values.registry.storage.type "s3" }}
  {{- with .Values.registry.storage.s3 }}
  REGISTRY_STORAGE_S3_REGION: {{ .region | default "" | quote }}
  REGISTRY_STORAGE_S3_BUCKET: {{ .bucket | default "" | quote }}
  REGISTRY_STORAGE_S3_REGIONENDPOINT: {{ .regionendpoint | default "" | quote }}
  REGISTRY_STORAGE_S3_ENCRYPT: {{ .encrypt | default false | quote }}
  REGISTRY_STORAGE_S3_SECURE: {{ .secure | default true | quote }}
  REGISTRY_STORAGE_S3_V4AUTH: {{ .v4auth | default true | quote }}
  REGISTRY_STORAGE_S3_CHUNKSIZE: {{ .chunksize | default 5242880 | quote }}
  REGISTRY_STORAGE_S3_ROOTDIRECTORY: {{ .rootdirectory | default "" | quote }}
  {{- end }}
  {{- end }}

  # Azure Storage
  {{- if eq .Values.registry.storage.type "azure" }}
  {{- with .Values.registry.storage.azure }}
  REGISTRY_STORAGE_AZURE_ACCOUNTNAME: {{ .accountname | default "" | quote }}
  REGISTRY_STORAGE_AZURE_CONTAINER: {{ .container | default "" | quote }}
  REGISTRY_STORAGE_AZURE_REALM: {{ .realm | default "core.windows.net" | quote }}
  {{- end }}
  {{- end }}

  # GCS Storage
  {{- if eq .Values.registry.storage.type "gcs" }}
  {{- with .Values.registry.storage.gcs }}
  REGISTRY_STORAGE_GCS_BUCKET: {{ .bucket | default "" | quote }}
  REGISTRY_STORAGE_GCS_ROOTDIRECTORY: {{ .rootdirectory | default "" | quote }}
  REGISTRY_STORAGE_GCS_CHUNKSIZE: {{ .chunksize | default 5242880 | quote }}
  {{- end }}
  {{- end }}

  # OSS Storage
  {{- if eq .Values.registry.storage.type "oss" }}
  {{- with .Values.registry.storage.oss }}
  REGISTRY_STORAGE_OSS_REGION: {{ .region | default "" | quote }}
  REGISTRY_STORAGE_OSS_BUCKET: {{ .bucket | default "" | quote }}
  REGISTRY_STORAGE_OSS_ENDPOINT: {{ .endpoint | default "" | quote }}
  REGISTRY_STORAGE_OSS_INTERNAL: {{ .internal | default false | quote }}
  REGISTRY_STORAGE_OSS_ENCRYPT: {{ .encrypt | default false | quote }}
  REGISTRY_STORAGE_OSS_SECURE: {{ .secure | default true | quote }}
  REGISTRY_STORAGE_OSS_CHUNKSIZE: {{ .chunksize | default 10485760 | quote }}
  REGISTRY_STORAGE_OSS_ROOTDIRECTORY: {{ .rootdirectory | default "" | quote }}
  {{- end }}
  {{- end }}

  # Logging
  LOG_LEVEL: {{ .Values.logLevel | default "info" | quote }}

  # Config via toEnvVars
  {{- if .Values.registry.config }}
  {{- include "harbor.toEnvVars" (dict "values" .Values.registry.config "prefix" "" "isSecret" false) | nindent 2 }}
  {{- end }}
