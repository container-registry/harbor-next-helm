  resources: {}

  # -- Node selector for Jobservice pods
  nodeSelector: {}

  # -- Tolerations for Jobservice pods
  tolerations: []

  # -- Affinity rules for Jobservice pods
  affinity: {}

  # -- Additional pod annotations for Jobservice
