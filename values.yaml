    tag: ""

  # -- Number of Portal replicas
  replicas: 1

  # -- Portal resource requests and limits
  resources: {}

  # -- Node selector for Portal pods
  nodeSelector: {}

  # -- Tolerations for Portal pods
  tolerations: []

  # -- Affinity rules for Portal pods
  affinity: {}

  # -- Additional pod annotations for Portal
  podAnnotations: {}

  # -- Additional pod labels for Portal
