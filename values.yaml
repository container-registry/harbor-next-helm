  # -- Security context for Portal container
  securityContext:
    runAsNonRoot: true
    runAsUser: 10000
    runAsGroup: 10000

  # -- Pod security context for Portal
  podSecurityContext:
    fsGroup: 10000

# --- Jobservice ---
jobservice:
  # -- Jobservice application config (converted to env vars in ConfigMap)
  # @default -- {}
  config: {}
    # max_job_workers: 10
    # job_loggers: file,stdout
    # logger_sweeper_duration: 14

  # -- Sensitive config for Jobservice (converted to env vars in Secret)
