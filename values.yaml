  replicas: 1

  # -- Exporter resource requests and limits
  resources: {}

  # -- Node selector for Exporter pods
  nodeSelector: {}

  # -- Tolerations for Exporter pods
  tolerations: []

  # -- Affinity rules for Exporter pods
  affinity: {}

  # -- Additional pod annotations for Exporter
  podAnnotations: {}

  # -- Additional pod labels for Exporter
