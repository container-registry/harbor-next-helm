# --- Exporter ---
exporter:
  # -- Enable Harbor exporter for Prometheus metrics
  enabled: true

  # -- Exporter application config (converted to env vars in ConfigMap)
  # @default -- {}
  config: {}
    # cache_time: 23
    # cache_clean_interval: 14400

  # -- Sensitive config for Exporter (converted to env vars in Secret)
  # @default -- {}
  secret: {}

  # -- Extra environment variables with valueFrom support
